[package]
name = "laplace-axiom-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Axiom execution contract: the vocabulary a DPOR core and its operation sources both speak"

[lib]
name = "laplace_axiom_contract"
path = "src/lib.rs"

# This crate is a leaf on purpose. Anything added here is added to the contract,
# and the contract is what customers implement — see the crate docs for the
# ownership rule. `laplace-macro` is present only to carry the `laplace_meta`
# doc-extraction attributes that moved with `ThreadId`/`ResourceId`.
[dependencies]
laplace-macro = { path = "../laplace-macro", version = "0.1.0-alpha-1" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[features]
default = []
scribe_docs = []
