[package]
name = "laplace-dpor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Classic DPOR reference algorithms for Laplace public verification smoke tests"
# crates.io `laplace-dpor` 이름은 비공개 엔진 크레이트가 갖는다 (LEP-0032 §2.27).
# 이 미러는 워크스페이스 내부 스모크 테스트 전용이며 이름을 주장하지 않는다.
publish = false

[lib]
name = "laplace_dpor"
path = "src/lib.rs"

[dependencies]
laplace-macro = { path = "../laplace-macro", version = "0.1.0-alpha-1" }
laplace-interfaces = { path = "../laplace-interfaces", version = "0.1.0-alpha-1" }
serde            = { version = "1.0", features = ["derive"] }
static_assertions = "1.1"
tracing          = "0.1"

[features]
default = []
scribe_docs = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
