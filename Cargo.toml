[workspace]
resolver = "2"
members = [
    "crates/laplace-axiom-contract",
    "crates/laplace-interfaces",
    "crates/laplace-model-rt",
    "crates/laplace-macro",
    "crates/laplace-probe-common",
    "crates/laplace-probe-sdk",
    "crates/laplace-sdk",
    "examples/bb8-hunt",
    "examples/bb8-hunt2",
    "examples/pingora-hunt",
    "examples/nonvendored-async-poc",
    "examples/quilkin-pktq-analog",
    "examples/quilkin-fchain-analog",
    "examples/quilkin-qcmp-analog",
    "examples/quilkin-xds-analog",
    "examples/byoc-demo",
    "examples/crossbeam-hunt",
    # Promoted out of `exclude` 2026-07-27 (REDESIGN-2a): the recorded blocker
    # ("resolve the parking_lot patch with SDK parking_lot_tracking without a
    # Cargo cycle") was not a cycle — dashmap-patched's `laplace` feature simply
    # never turned `laplace-probe-sdk/parking_lot_tracking` on, so the three
    # TrackedParkingLotRwLock imports failed and 84 errors cascaded from them.
    "examples/dashmap-hunt",
    "examples/deadpool-hunt",
    "examples/integration-test",
    "examples/known-bug-hunt",
    "examples/mobc-hunt",
    "examples/mobc-real",
    "examples/r2d2-hunt",
    "examples/rayon-hunt",
]
exclude = [
    # Requires eBPF-oriented host/toolchain support; keep it explicit instead of hiding it.
    "examples/ebpf-lock-test",
    # Depends on cloud/private laplace_probe paths; keep out of public workspace checks.
    "examples/demo-server",
    # Measured 2026-07-27 (REDESIGN-2a): the stated "parking_lot patch vs SDK
    # parking_lot_tracking Cargo cycle" does not exist. parking_lot-patched's
    # dependency on the SDK is optional and off, so enabling the feature resolves
    # cleanly — `laplace-probe-sdk = { features = ["parking_lot_tracking"] }` in
    # this example's dev-dependencies builds and passes 6/6 with 0 hangs in 120
    # runs. What is left is 27 clippy::pedantic findings this crate never saw
    # while it sat outside the workspace. Promotion is a follow-up, not a cycle.
    "examples/parking_lot-hunt",
    # Measured 2026-07-27 (REDESIGN-2a): tokio_unstable is not the blocker — the
    # patched tokio builds clean here. Two real defects are: `tokio_three_lock_chain`
    # asserts a bug the public reference checker structurally cannot find (it
    # detects 2-cycles; that test builds a 3-cycle A->B->C->A), and the suite
    # executes real blocking lock cycles on real OS threads, so it self-deadlocks
    # 14/60 runs. Fix the test, not the workspace wiring.
    "examples/tokio-hunt",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/bb8-patched",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/crossbeam-patched",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/dashmap-patched",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/deadpool-patched",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/deadpool-runtime",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/futures-util-patched",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/lock_api-patched",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/mobc",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/parking_lot-patched",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/r2d2-patched",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/rayon-patched",
    # Vendored upstream patched crates auto-promote from [patch.crates-io] paths; do not lint upstream code as first-class workspace code.
    "vendor/tokio-patched",
]

[workspace.package]
version = "0.1.0-alpha-1"
edition = "2021"
rust-version = "1.88.0"
authors = ["Laplace Labs"]
license = "Apache-2.0"
repository = "https://github.com/Laplace-Labs-inc/laplace"

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
async-trait = "0.1.89"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(laplace_private_verification)', 'cfg(laplace_private_harness)'] }

# Patched crates for bug-detection examples (hunt examples only)
[patch.crates-io]
lock_api          = { path = "vendor/lock_api-patched" }
dashmap           = { path = "vendor/dashmap-patched" }
parking_lot       = { path = "vendor/parking_lot-patched" }
crossbeam-channel = { path = "vendor/crossbeam-patched" }
rayon             = { path = "vendor/rayon-patched" }
mobc              = { path = "vendor/mobc" }
deadpool          = { path = "vendor/deadpool-patched" }
